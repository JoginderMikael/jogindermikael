<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">Microservices architecture</title>
  <desc id="d">API Gateway connects three services through Kafka to PostgreSQL and Redis.</desc>
  <defs>
    <style>
      .box{fill:#071b2a;stroke:#3b596c;stroke-width:2}.label{fill:#dce7ee;font:600 16px Inter,Arial,sans-serif}.small{fill:#9fc8dc;font:600 13px "JetBrains Mono",monospace}.line{stroke:#7ba0b3;stroke-width:2;fill:none}.accent{stroke:#43c7ff}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7ba0b3"/></marker>
  </defs>
  <rect width="720" height="440" rx="24" fill="#031421"/>
  <rect class="box" x="250" y="35" width="220" height="58" rx="10"/><text class="label" x="360" y="71" text-anchor="middle">API GATEWAY</text>
  <path class="line" d="M360 93v38M130 131h460M130 131v32M360 131v32M590 131v32"/>
  <rect class="box" x="35" y="163" width="190" height="58" rx="10"/><text class="small" x="130" y="198" text-anchor="middle">USER SERVICE</text>
  <rect class="box" x="265" y="163" width="190" height="58" rx="10"/><text class="small" x="360" y="198" text-anchor="middle">ORDER SERVICE</text>
  <rect class="box" x="495" y="163" width="190" height="58" rx="10"/><text class="small" x="590" y="198" text-anchor="middle">PAYMENT SERVICE</text>
  <path class="line accent" d="M130 221v43M360 221v43M590 221v43"/>
  <rect class="box" x="250" y="264" width="220" height="58" rx="10"/><text class="label" x="360" y="300" text-anchor="middle">KAFKA</text>
  <path class="line" marker-end="url(#arrow)" d="M360 322v35M360 357H180v25M360 357h180v25"/>
  <rect class="box" x="75" y="382" width="210" height="44" rx="10"/><text class="small" x="180" y="410" text-anchor="middle">POSTGRESQL</text>
  <rect class="box" x="435" y="382" width="210" height="44" rx="10"/><text class="small" x="540" y="410" text-anchor="middle">REDIS</text>
</svg>

